{{- if eq .Section "cv" }}
<style>
  /* 印刷ヘッダーはスクリーンでは非表示 */
  .print-cv-header {
    display: none;
  }

  @media print {

    /* ─── Page Setup ───────────────────────────────── */
    @page {
      size: A4 portrait;
      margin: 18mm 20mm 18mm 20mm;

      @top-right {
        content: "Curriculum Vitae - Chiaki Miura";
        font-size: 8pt;
        color: #666;
        vertical-align: bottom;
      }
    }

    /* ─── 背景白・テキスト黒に統一 ─────────────────── */
    *,
    *::before,
    *::after {
      background: transparent !important;
      color: #000 !important;
      box-shadow: none !important;
      text-shadow: none !important;
    }

    html,
    body {
      background: #fff !important;
      font-size: 10pt;
      line-height: 1.5;
    }

    /* ─── ナビ・フッター等を非表示 ─────────────────── */
    .header,
    .footer,
    .top-link,
    #theme-toggle,
    .logo-switches,
    #post-list {
      display: none !important;
    }

    /* ─── 見出しアンカーリンクを非表示 ─────────────── */
    .anchor {
      display: none !important;
    }

    /* ─── セクションタイトル「CV」を非表示（独自ヘッダーで代替）── */
    .page-header {
      display: none !important;
    }

    /* ─── レイアウト: max-width を解除して全幅に ────── */
    .main {
      max-width: 100% !important;
      min-height: auto !important;
      margin: 0 !important;
      padding: 0 !important;
    }

    .post-content {
      margin: 0 !important;
      max-width: 100% !important;
      width: 100% !important;
    }

    /* ─── 印刷専用ヘッダー ───────────────────────────── */
    .print-cv-header {
      display: flex;
      align-items: center;
      gap: 10mm;
      margin-bottom: 6mm;
      padding-bottom: 4mm;
      border-bottom: 1.5pt solid #000;
      page-break-inside: avoid;
      break-inside: avoid;
    }

    .print-cv-photo {
      width: 43mm;
      height: 58mm;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
    }

    .print-cv-name {
      font-size: 20pt !important;
      font-weight: bold;
      margin: 0 0 2mm 0 !important;
      line-height: 1.2;
    }

    .print-cv-affil {
      font-size: 10pt !important;
      margin: 0 0 3mm 0 !important;
      color: #333 !important;
    }

    .print-cv-contacts {
      display: flex;
      flex-direction: column;
      gap: 0.5mm;
      font-size: 8.5pt;
      color: #444 !important;
    }

    .print-cv-contacts span {
      display: block;
    }

    .print-cv-contacts a {
      display: inline;
      color: #000 !important;
      text-decoration: underline;
      box-shadow: none !important;
    }

    /* ヘッダー内リンクはURLを展開しない */
    .print-cv-header a[href]::after {
      content: "" !important;
    }

    /* ─── タイポグラフィ（pt単位で印刷向け） ─────────── */
    .post-content h1 {
      font-size: 16pt;
      margin-top: 14pt;
      margin-bottom: 6pt;
    }

    .post-content h2 {
      font-size: 13pt;
      margin-top: 10pt;
      margin-bottom: 4pt;
    }

    .post-content h3 {
      font-size: 11pt;
      margin-top: 8pt;
      margin-bottom: 3pt;
    }

    .post-content p,
    .post-content li {
      font-size: 10pt;
      margin-bottom: 3pt;
    }

    /* ─── リンク: URLを括弧内に展開 ─────────────────── */
    .post-content a[href]::after {
      content: " (" attr(href) ")";
      font-size: 8pt;
      color: #444 !important;
      word-break: break-all;
    }

    /* 内部アンカーリンク (#...) は展開しない */
    .post-content a[href^="#"]::after {
      content: "";
    }

    .post-content a {
      box-shadow: none !important;
      text-decoration: underline;
    }

    /* ─── 改ページ制御 ───────────────────────────────── */
    h1,
    h2,
    h3 {
      page-break-after: avoid;
      break-after: avoid;
    }

    ul,
    ol,
    li {
      page-break-inside: avoid;
      break-inside: avoid;
    }

    p {
      orphans: 3;
      widows: 3;
    }
  }
</style>
{{- end }}
