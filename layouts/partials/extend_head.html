{{- if eq .Section "cv" }}
<style>
  /* 印刷ヘッダーはスクリーンでは非表示 */
  .print-cv-header {
    display: none;
  }

  @media print {

    /* ─── Page Setup ───────────────────────────────── */
    @page {
      size: A4 portrait;
      margin: 18mm 20mm 18mm 20mm;

      @top-right {
        content: "Curriculum Vitae - Chiaki Miura";
        font-size: 8pt;
        color: #666;
        vertical-align: bottom;
      }
    }

    /* ─── 背景白・テキスト黒に統一 ─────────────────── */
    *,
    *::before,
    *::after {
      background: transparent !important;
      color: #000 !important;
      box-shadow: none !important;
      text-shadow: none !important;
    }

    html,
    body {
      background: #fff !important;
      font-size: 10pt;
      line-height: 1.5;
    }

    /* ─── ナビ・フッター等を非表示 ─────────────────── */
    .header,
    .footer,
    .top-link,
    #theme-toggle,
    .logo-switches,
    #post-list {
      display: none !important;
    }

    /* ─── 見出しアンカーリンクを非表示 ─────────────── */
    .anchor {
      display: none !important;
    }

    /* ─── セクションタイトル「CV」を非表示（独自ヘッダーで代替）── */
    .page-header {
      display: none !important;
    }

    /* ─── レイアウト: max-width を解除して全幅に ────── */
    .main {
      max-width: 100% !important;
      min-height: auto !important;
      margin: 0 !important;
      padding: 0 !important;
    }

    .post-content {
      margin: 0 !important;
      max-width: 100% !important;
      width: 100% !important;
    }

    /* ─── 印刷専用ヘッダー ───────────────────────────── */
    .print-cv-header {
      display: flex;
      align-items: center;
      gap: 10mm;
      margin-bottom: 6mm;
      padding-bottom: 4mm;
      border-bottom: 1.5pt solid #000;
      page-break-inside: avoid;
      break-inside: avoid;
    }

    .print-cv-photo {
      width: 43mm;
      height: 58mm;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
    }

    .print-cv-name {
      font-size: 20pt !important;
      font-weight: bold;
      margin: 0 0 2mm 0 !important;
      line-height: 1.2;
    }

    .print-cv-affil {
      font-size: 10pt !important;
      margin: 0 0 3mm 0 !important;
      color: #333 !important;
    }

    .print-cv-contacts {
      display: flex;
      flex-direction: column;
      gap: 0.5mm;
      font-size: 8.5pt;
      color: #444 !important;
    }

    .print-cv-contacts span {
      display: block;
    }

    .print-cv-contacts a {
      display: inline;
      color: #000 !important;
      text-decoration: underline;
      box-shadow: none !important;
    }

    /* ヘッダー内リンクはURLを展開しない */
    .print-cv-header a[href]::after {
      content: "" !important;
    }

    /* ─── タイポグラフィ（pt単位で印刷向け） ─────────── */
    .post-content h1 {
      font-size: 16pt;
      margin-top: 14pt;
      margin-bottom: 6pt;
    }

    .post-content h2 {
      font-size: 13pt;
      margin-top: 10pt;
      margin-bottom: 4pt;
    }

    .post-content h3 {
      font-size: 11pt;
      margin-top: 8pt;
      margin-bottom: 3pt;
    }

    .post-content p,
    .post-content li {
      font-size: 10pt;
      margin-bottom: 3pt;
    }

    /* ─── リンク: URLを括弧内に展開 ─────────────────── */
    .post-content a[href]::after {
      content: " (" attr(href) ")";
      font-size: 8pt;
      color: #444 !important;
      word-break: break-all;
    }

    /* 内部アンカーリンク (#...) は展開しない */
    .post-content a[href^="#"]::after {
      content: "";
    }

    .post-content a {
      box-shadow: none !important;
      text-decoration: underline;
    }

    /* ─── 改ページ制御 ───────────────────────────────── */
    h1,
    h2,
    h3 {
      page-break-after: avoid;
      break-after: avoid;
    }

    ul,
    ol,
    li {
      page-break-inside: avoid;
      break-inside: avoid;
    }

    p {
      orphans: 3;
      widows: 3;
    }
  }
</style>
{{- end }}{{- if eq .Layout "bare" }}
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap">
  <style>
    :root {
      --paper: #E7E5DA;
      --paper-raised: #F2F0E6;
      --paper-deep: #DAD8CB;
      --ink: #1B1E1A;
      --ink-soft: #565A50;
      --ink-faint: #8B8E82;
      --indigo: #2A4468;
      --indigo-deep: #1D3151;
      --indigo-soft: #DCE3EC;
      --ochre: #93712A;
      --ochre-deep: #6E5620;
      --ochre-soft: #EDE2C6;
      --vermilion: #A63A2C;
      --vermilion-soft: #F1DAD3;
      --line: rgba(27, 30, 26, 0.16);
      --line-strong: rgba(27, 30, 26, 0.32);
      --shadow: 0 1px 0 rgba(27, 30, 26, 0.06);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --paper: #15181A;
        --paper-raised: #1D2124;
        --paper-deep: #0F1112;
        --ink: #E9E7DC;
        --ink-soft: #ABAE9F;
        --ink-faint: #767A6C;
        --indigo: #7FA0CC;
        --indigo-deep: #A9C1E0;
        --indigo-soft: #212B38;
        --ochre: #D9B25C;
        --ochre-deep: #EAD08C;
        --ochre-soft: #322A16;
        --vermilion: #E2786A;
        --vermilion-soft: #3A211D;
        --line: rgba(233, 231, 220, 0.16);
        --line-strong: rgba(233, 231, 220, 0.32);
        --shadow: 0 1px 0 rgba(0, 0, 0, 0.3);
      }
    }

    :root[data-theme="dark"] {
      --paper: #15181A;
      --paper-raised: #1D2124;
      --paper-deep: #0F1112;
      --ink: #E9E7DC;
      --ink-soft: #ABAE9F;
      --ink-faint: #767A6C;
      --indigo: #7FA0CC;
      --indigo-deep: #A9C1E0;
      --indigo-soft: #212B38;
      --ochre: #D9B25C;
      --ochre-deep: #EAD08C;
      --ochre-soft: #322A16;
      --vermilion: #E2786A;
      --vermilion-soft: #3A211D;
      --line: rgba(233, 231, 220, 0.16);
      --line-strong: rgba(233, 231, 220, 0.32);
      --shadow: 0 1px 0 rgba(0, 0, 0, 0.3);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", sans-serif;
      line-height: 1.8;
      -webkit-font-smoothing: antialiased;
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.001ms !important;
        transition-duration: 0.001ms !important;
      }
    }

    .mono {
      font-family: "JetBrains Mono", ui-monospace, monospace;
    }

    .serif {
      font-family: "Shippori Mincho", serif;
    }

    a {
      color: var(--indigo);
      text-decoration-thickness: 1px;
      text-underline-offset: 2px;
    }

    a:focus-visible,
    button:focus-visible {
      outline: 2px solid var(--vermilion);
      outline-offset: 2px;
    }

    .wrap {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* ---------- Hero ---------- */
    .hero {
      position: relative;
      border-bottom: 1px solid var(--line-strong);
      padding: 72px 0 56px;
      background:
        linear-gradient(180deg, var(--paper-raised), var(--paper) 85%);
    }

    .draft-stamp {
      position: absolute;
      top: 28px;
      right: 24px;
      width: 84px;
      height: 84px;
      border: 2px solid var(--vermilion);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: rotate(-11deg);
      color: var(--vermilion);
      font-family: "JetBrains Mono", monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .06em;
      text-align: center;
      line-height: 1.3;
      opacity: .9;
    }

    .draft-stamp span {
      display: block;
    }

    @media (max-width: 520px) {
      .hero {
        padding-top: 122px;
      }

      .draft-stamp {
        top: 20px;
        right: 20px;
        width: 68px;
        height: 68px;
        font-size: 9.5px;
      }
    }

    .eyebrow {
      font-family: "JetBrains Mono", monospace;
      font-size: 12px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--ink-soft);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .eyebrow::before {
      content: "";
      width: 22px;
      height: 1px;
      background: var(--ink-faint);
    }

    h1.title {
      font-family: "Shippori Mincho", serif;
      font-weight: 800;
      font-size: clamp(34px, 6vw, 58px);
      line-height: 1.25;
      margin: 18px 0 22px;
      text-wrap: balance;
      max-width: 14ch;
    }

    .lede {
      font-size: 24.5px;
      color: var(--ink-soft);
      max-width: 56ch;
    }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 28px;
      margin-top: 28px;
      font-family: "JetBrains Mono", monospace;
      font-size: 12px;
      color: var(--ink-faint);
    }

    .meta-row b {
      color: var(--ink-soft);
      font-weight: 500;
    }

    /* ---------- Section scaffold ---------- */
    section.block {
      padding: 64px 0;
      border-bottom: 1px solid var(--line);
    }

    section.block:last-of-type {
      border-bottom: none;
    }

    section.block.emphasis {
      /* palette inversion: solid ochre ground with near-black ink — the strongest stop on the page, in both light and dark viewer themes */
      --paper: #ebd094;
      --paper-raised: #eeddba;
      --paper-deep: #C68A2E;
      --ink: #1A1200;
      --ink-soft: #4A3814;
      --ink-faint: #6E5726;
      --indigo: #1D3151;
      --indigo-deep: #14253D;
      --indigo-soft: #DCE3EC;
      --ochre: #7A5A1E;
      --ochre-deep: #58400F;
      --ochre-soft: #F1E4C0;
      --vermilion: #7A2318;
      --vermilion-soft: #E7C9B7;
      --line: rgba(33, 23, 5, 0.25);
      --line-strong: rgba(33, 23, 5, 0.45);
      background: var(--paper);
      color: var(--ink);
      border-top: 3px solid var(--vermilion);
      border-bottom: 3px solid var(--vermilion);
    }

    .block-head {
      display: flex;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 28px;
    }

    .tab {
      flex: none;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 1.5px solid var(--vermilion);
      color: var(--vermilion);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "JetBrains Mono", monospace;
      font-size: 15px;
      font-weight: 700;
    }

    .block-head-text {
      padding-top: 2px;
    }

    .block-kicker {
      font-family: "JetBrains Mono", monospace;
      font-size: 11.5px;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--ink-faint);
      margin: 0 0 6px;
    }

    h2.block-title {
      font-family: "Shippori Mincho", serif;
      font-weight: 700;
      font-size: clamp(22px, 3.4vw, 30px);
      margin: 0;
      text-wrap: balance;
    }

    .lead-p {
      max-width: 124ch;
      color: var(--ink-soft);
      font-size: 15.5px;
    }

    .lead-p strong {
      color: var(--ink);
      font-weight: 700;
    }

    /* ---------- generic card ---------- */
    .card {
      background: var(--paper-raised);
      border: 1px solid var(--line);
      padding: 24px;
    }

    .card h3 {
      font-family: "Zen Kaku Gothic New", sans-serif;
      font-size: 15px;
      font-weight: 900;
      margin: 0 0 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .swatch {
      width: 10px;
      height: 10px;
      flex: none;
    }

    /* ---------- Block 1: two-card comparison ---------- */
    .compare {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: var(--line-strong);
      border: 1px solid var(--line-strong);
      margin-top: 8px;
    }

    @media (max-width:640px) {
      .compare {
        grid-template-columns: 1fr;
      }
    }

    .compare>div {
      background: var(--paper-raised);
      padding: 26px;
      min-width: 0;
      container-type: inline-size;
    }

    .region-label {
      font-family: "JetBrains Mono", monospace;
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .region-label.na {
      color: var(--indigo);
    }

    .region-label.jp {
      color: var(--ochre);
    }

    .stat-line {
      padding: 12px 0;
      border-top: 1px solid var(--line);
    }

    .stat-line:first-of-type {
      border-top: none;
    }

    .stat-num {
      font-family: "JetBrains Mono", monospace;
      font-weight: 800;
      font-size: clamp(32px, 20.5cqi, 68px);
      line-height: 0.98;
      letter-spacing: -.01em;
      font-variant-numeric: tabular-nums;
      word-break: keep-all;
      overflow-wrap: normal;
    }

    .stat-num.accent-indigo {
      color: var(--indigo);
    }

    .stat-num.accent-ochre {
      color: var(--ochre);
    }

    .stat-num small {
      font-size: .34em;
      font-weight: 600;
      color: var(--ink-soft);
      white-space: nowrap;
    }

    .stat-cap {
      font-size: 14px;
      color: var(--ink-soft);
      margin-top: 8px;
      max-width: 42ch;
    }

    .ref {
      font-family: "JetBrains Mono", monospace;
      font-size: 10.5px;
      color: var(--ink-faint);
    }

    .redacted {
      margin-top: 12px;
      border: 1px dashed var(--vermilion);
      padding: 16px;
      background:
        repeating-linear-gradient(135deg, var(--vermilion-soft) 0 10px, transparent 10px 20px);
    }

    .redacted .stat-num {
      color: var(--vermilion);
      letter-spacing: .05em;
    }

    .redacted .stat-cap {
      color: var(--ink);
    }

    .redacted .note {
      font-size: 12.5px;
      color: var(--ink-soft);
      margin-top: 8px;
    }

    .gauge-wrap {
      margin-top: 18px;
    }

    .gauge {
      position: relative;
      margin: 14px 0;
    }

    .gauge-label {
      display: flex;
      justify-content: space-between;
      font-size: 12.5px;
      color: var(--ink-soft);
      margin-bottom: 4px;
    }

    .gauge-track {
      position: relative;
      height: 14px;
      background: #fff;
      border: 1px solid var(--line);
    }

    .gauge-fill {
      position: absolute;
      inset: 0 auto 0 0;
      background: var(--vermilion);
    }

    .gauge-fill.over {
      background: var(--vermilion);
    }

    .gauge-cap {
      position: absolute;
      top: -4px;
      bottom: -4px;
      left: 66.6%;
      width: 0;
      border-left: 1.5px dashed var(--ink-faint);
    }

    .gauge-cap::after {
      content: "100%";
      position: absolute;
      top: -18px;
      left: -16px;
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      color: var(--ink-faint);
    }

    /* ---------- Block 1: mini bar chart (NA) ---------- */
    .bar-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      column-gap: 40px;
    }

    .bar-row .mini-bars {
      flex: none;
    }

    .bar-row .stat-line {
      flex: 1 1 220px;
      min-width: 200px;
      border-top: none;
    }

    .mini-bars {
      display: flex;
      align-items: flex-end;
      gap: 40px;
      height: 200px;
      margin-top: 18px;
      border-bottom: 3px solid var(--ink);
      padding: 0 4px;
    }

    .mini-bar-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      height: 100%;
    }

    .mini-bar-val {
      font-family: "JetBrains Mono", monospace;
      font-weight: 800;
      font-size: 22px;
      margin-bottom: 8px;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .mini-bar {
      width: 112px;
      background: var(--indigo);
    }

    .mini-bar-cap {
      margin-top: 10px;
      font-size: 12.5px;
      color: var(--ink-soft);
      text-align: center;
    }

    /* ---------- Block 1: capacity-limit callout (JP) ---------- */
    .limit-callout {
      margin-top: 16px;
      padding: 14px 16px;
      border: 1px solid var(--vermilion);
      background: var(--vermilion-soft);
    }

    .limit-callout .limit-num {
      font-family: "JetBrains Mono", monospace;
      font-weight: 700;
      font-size: 34px;
      color: var(--vermilion);
      line-height: 1;
    }

    .limit-callout .limit-text {
      font-size: 14px;
      color: var(--ink);
      margin-top: 6px;
    }

    .limit-callout .limit-text b {
      color: var(--vermilion);
    }

    /* ---------- Block 2: scale facts (text only, no chart boxes) ---------- */
    .h-scroll {
      overflow-x: auto;
      padding-bottom: 6px;
      margin-top: 20px;
    }

    .fact-trio {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px 24px;
    }

    .fact-item {
      container-type: inline-size;
      min-width: 0;
      padding-top: 18px;
      border-top: 2px solid var(--ink);
    }

    .fact-num {
      font-family: "JetBrains Mono", monospace;
      font-weight: 800;
      font-size: clamp(26px, 17cqi, 46px);
      line-height: 1;
      letter-spacing: -.01em;
      color: var(--indigo);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .fact-cap {
      margin-top: 12px;
      font-size: 13px;
      line-height: 1.5;
      color: var(--ink-soft);
    }

    @media (max-width:720px) {
      .fact-trio {
        grid-template-columns: 1fr;
        gap: 22px;
      }

      .fact-item {
        border-top-width: 3px;
      }

      .fact-num {
        font-size: clamp(40px, 15vw, 60px);
      }
    }

    .gov-tiers {
      margin-top: 26px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .gov-tier {
      border: 1px solid var(--line);
      background: var(--paper-raised);
      padding: 14px 18px;
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: 16px;
      align-items: baseline;
    }

    @media (max-width:560px) {
      .gov-tier {
        grid-template-columns: 1fr;
        gap: 4px;
      }
    }

    .gov-tier .tier-name {
      font-family: "JetBrains Mono", monospace;
      font-size: 12px;
      color: var(--indigo);
      font-weight: 700;
    }

    .gov-tier .tier-desc {
      font-size: 13.5px;
      color: var(--ink-soft);
    }

    .gov-tier.t1 {
      margin-left: 0;
    }

    .gov-tier.t2 {
      margin-left: 20px;
    }

    .gov-tier.t3 {
      margin-left: 40px;
    }

    /* ---------- Block 3: timeline ---------- */
    .timeline {
      display: flex;
      align-items: stretch;
      min-width: 760px;
      margin-top: 8px;
    }

    .tl-node {
      flex: 1;
      position: relative;
      padding: 0 14px 30px;
    }

    .tl-node::before {
      content: "";
      position: absolute;
      top: 8px;
      left: 0;
      right: 0;
      height: 1px;
      background: var(--line-strong);
    }

    .tl-node:first-child::before {
      left: 50%;
    }

    .tl-node:last-child::before {
      right: 50%;
    }

    .tl-dot {
      position: absolute;
      top: 2px;
      left: 50%;
      transform: translateX(-50%);
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--paper);
      border: 2px solid var(--ink-faint);
    }

    .tl-node.now .tl-dot {
      border-color: var(--vermilion);
      background: var(--vermilion);
    }

    .tl-date {
      margin-top: 22px;
      font-family: "JetBrains Mono", monospace;
      font-size: 12px;
      font-weight: 700;
      color: var(--ink);
      text-align: center;
    }

    .tl-node.now .tl-date {
      color: var(--vermilion);
    }

    .tl-text {
      font-size: 12.5px;
      color: var(--ink-soft);
      text-align: center;
      margin-top: 6px;
    }

    .abc-track {
      display: flex;
      min-width: 520px;
      margin-top: 34px;
      gap: 0;
    }

    .abc-step {
      flex: 1;
      text-align: center;
      position: relative;
      padding: 0 8px 6px;
    }

    .abc-step .abc-bar {
